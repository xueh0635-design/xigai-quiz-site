name: Repository validation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/android-update.json'
  pull_request:
  workflow_dispatch:
    inputs:
      run_ios:
        description: Run iPhone smoke tests and qualify this run for publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix mobile ci
      - run: npm --prefix mobile run verify

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm --prefix mobile ci
      - name: Test cold migrations and database authorization locally
        run: node --test backend/tests/database.test.mjs

  browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm --prefix mobile ci
      - name: Install the pinned Chromium test runtime
        working-directory: mobile
        run: npx --no-install playwright install --with-deps chromium
      - run: npm --prefix mobile run build:web
      - name: Test offline study and shared IndexedDB across tabs
        run: node --test mobile/tests/browser/*.cjs

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Prepare the committed Android bundle
        run: |
          npm --prefix mobile ci
          node tools/copy-web.cjs mobile/www
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Generate Android project
        working-directory: mobile
        run: |
          npx --no-install cap add android
          node android-native/install.cjs
      - name: Build the release artifact from this exact commit
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:assembleRelease -PquizSourceCommit="$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

  ios-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.run_ios
    runs-on: macos-26
    timeout-minutes: 40
    env:
      APP_ID: io.github.xueh0635.xigai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Prepare the simulator app
        working-directory: mobile
        run: |
          npm ci
          node ../tools/copy-web.cjs www
          python3 tests/inject-smoke.py www/index.html
          npx --no-install cap add ios
          node ios-native/install.cjs
          cmp art/app-icon.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Select and build for iPhone
        run: |
          xcodebuild -version
          phone=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime in sorted(devices, reverse=True) for d in devices[runtime] if d["name"].startswith("iPhone")))')
          echo "PHONE=$phone" >> "$GITHUB_ENV"
          xcrun simctl boot "$phone"
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=$phone" -derivedDataPath "$RUNNER_TEMP/xigai-ios" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xigai-build.log" 2>&1 || {
            tail -120 "$RUNNER_TEMP/xigai-build.log"
            exit 1
          }
      - name: Launch and verify the practice flow
        run: |
          mkdir -p "$RUNNER_TEMP/xigai-check"
          xcrun simctl bootstatus "$PHONE" -b
          xcrun simctl status_bar "$PHONE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState discharging --batteryLevel 100
          xcrun simctl install "$PHONE" "$RUNNER_TEMP/xigai-ios/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$PHONE" "$APP_ID"
          swiftc mobile/tests/verify-ios-smoke.swift -o "$RUNNER_TEMP/verify-ios"
          for attempt in 1 2 3 4 5; do
            xcrun simctl io "$PHONE" screenshot "$RUNNER_TEMP/xigai-check/ios-practice.png"
            if "$RUNNER_TEMP/verify-ios" "$RUNNER_TEMP/xigai-check/ios-practice.png"; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-simulator-check
          path: |
            ${{ runner.temp }}/xigai-check
            ${{ runner.temp }}/xigai-build.log

  release-gate:
    name: release-gate
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_ios)
    needs: [verify, database, browser-flow, android-build, ios-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every release check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          checks = json.loads(os.environ['CHECK_RESULTS'])
          failed = [name for name, check in checks.items() if check['result'] != 'success']
          if failed:
              sys.exit('Release checks did not pass: ' + ', '.join(failed))
          print('All source, database, browser, Android and iPhone checks passed for this commit.')
          PY
