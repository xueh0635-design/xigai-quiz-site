name: Option details iPhone QA

on:
  push:
    paths:
      - 'docs/index.html'
      - 'mobile/**'
      - '.github/workflows/ios-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: option-details-iphone-qa
  cancel-in-progress: true

jobs:
  build-and-practice:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      APP_ID: io.github.xueh0635.xigai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Prepare the simulator app
        working-directory: mobile
        run: |
          npm ci
          mkdir -p www
          cp ../docs/index.html www/index.html
          python3 tests/inject-smoke.py www/index.html
          npx --no-install cap add ios
          node ios-native/install.cjs
          cp art/app-icon.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Select and build for iPhone
        run: |
          xcodebuild -version
          phone=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime in sorted(devices, reverse=True) for d in devices[runtime] if d["name"].startswith("iPhone")))')
          echo "PHONE=$phone" >> "$GITHUB_ENV"
          xcrun simctl boot "$phone"
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=$phone" -derivedDataPath "$RUNNER_TEMP/xigai-ios" \
            MARKETING_VERSION=1.1.26 CURRENT_PROJECT_VERSION=28 CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xigai-build.log" 2>&1 || {
            tail -120 "$RUNNER_TEMP/xigai-build.log"
            exit 1
          }
      - name: Launch and verify the practice flow
        run: |
          mkdir -p "$RUNNER_TEMP/xigai-check"
          xcrun simctl bootstatus "$PHONE" -b
          xcrun simctl status_bar "$PHONE" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState discharging --batteryLevel 100
          xcrun simctl install "$PHONE" "$RUNNER_TEMP/xigai-ios/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$PHONE" "$APP_ID"
          swiftc mobile/tests/verify-ios-smoke.swift -o "$RUNNER_TEMP/verify-ios"
          for attempt in 1 2 3 4 5; do
            xcrun simctl io "$PHONE" screenshot "$RUNNER_TEMP/xigai-check/ios-practice.png"
            if "$RUNNER_TEMP/verify-ios" "$RUNNER_TEMP/xigai-check/ios-practice.png"; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-simulator-check
          path: |
            ${{ runner.temp }}/xigai-check
            ${{ runner.temp }}/xigai-build.log
