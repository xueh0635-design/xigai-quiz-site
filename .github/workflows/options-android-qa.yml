name: Option details Android QA
on:
  push:
    branches: [qa/option-details-1.1.26]
permissions:
  contents: read
jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APK with the isolated smoke harness
        working-directory: mobile
        run: |
          npm ci
          mkdir -p www
          cp ../docs/index.html www/index.html
          python3 tests/inject-smoke.py www/index.html
          npx --no-install cap add android
          node android-native/install.cjs
          cd android
          ./gradlew :app:assembleDebug -PquizVersionName=1.1.26 -PquizVersionCode=28
      - name: Open the Android build and verify the study flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash mobile/tests/run-options-android-qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-option-details-check
          path: |
            android-option-proof.png
            android-option-ui.xml
